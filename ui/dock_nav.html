<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maximum Tweaks – Dock Navigation</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:transparent}
body{font-family:'Segoe UI',system-ui,sans-serif;color:#d6d3ee;overflow:hidden;opacity:0;transition:opacity .18s ease-out}
body.ready{opacity:1}
/* top:0 as well as bottom:0 so this fills the whole 680x340 widget viewport.
   With an auto height the wrapper was only 332 tall, which left the top 8px
   unblurred and squashed the snapshot 2.4% out of alignment with the page. */
.dockwrap{position:fixed;top:0;bottom:0;left:50%;transform:translateX(-50%);z-index:999;
 display:flex;flex-direction:column;align-items:center;justify-content:flex-end;width:680px;padding-bottom:14px;pointer-events:none}
/* FROSTED GLASS BACKDROP. --bd is a blurred snapshot of the page behind the
   dock, produced on the Qt side (see refresh_backdrop in dock_nav.py).
   CSS backdrop-filter cannot replace it: this document is a transparent web
   view in its own widget, so the page is a sibling widget and never appears in
   this rendering tree for a filter to sample.
   The snapshot is painted by .pop and .dock themselves, NOT by a full-widget
   layer. A full-size layer would keep painting the panel's area while the panel
   is closed and bring the ghost dock back. Each element pulls its own slice out
   of the 680x340 snapshot with background-position, so the glass is confined to
   the two visible shapes. The offsets are measured in place() and stay correct
   if the bar's height ever changes. */
.glow{position:absolute;inset:0;z-index:0;border-radius:inherit;pointer-events:none;transition:background 1.1s ease;background:transparent}
.dock{pointer-events:auto}

/* PANEL: interruptible CSS transitions, a soft spring on open, quick ease-in on close */
.pop{position:relative;z-index:1;width:100%;min-height:212px;margin-bottom:12px;border-radius:24px;
  background:linear-gradient(160deg,rgba(62,42,124,.34),rgba(14,9,32,.46)),
             var(--bdImage,none) 0 var(--popY,0px)/680px 340px no-repeat;
  background-color:rgba(14,9,32,.34);
  border:1px solid rgba(201,192,255,.16);
  box-shadow:0 18px 44px rgba(12,4,32,.55),inset 0 1px 0 rgba(214,205,255,.16);overflow:hidden;
  opacity:0;visibility:hidden;pointer-events:none;transform:translateY(18px) scale(.965);transform-origin:50% 100%;
  transition:opacity .16s ease-in,transform .2s cubic-bezier(.4,0,1,1),visibility 0s linear .2s}
.pop.show{opacity:1;visibility:visible;pointer-events:auto;transform:none;
  transition:opacity .22s ease-out,transform .46s cubic-bezier(.34,1.32,.5,1),visibility 0s}

/* LAYERS: each category slides in from the side you are moving toward, the old one slides out the other way.
   --ix / --ox are set from JS per switch (0 on first open so it simply rises). */
.pg{position:absolute;inset:0;padding:14px;display:grid;grid-template-columns:repeat(3,1fr);align-content:center;gap:10px;
  opacity:0;visibility:hidden;pointer-events:none;filter:blur(5px);
  transform:translateX(var(--ix,0px)) translateY(14px) scale(.97)}
.pg.on{opacity:1;visibility:visible;pointer-events:auto;filter:blur(0);transform:none;z-index:2;
  transition:opacity .34s ease-out .05s,transform .55s cubic-bezier(.22,1.15,.3,1) .05s,filter .34s ease-out .05s}
.pg.exit{opacity:0;visibility:hidden;filter:blur(5px);z-index:1;transform:translateX(var(--ox,0px)) translateY(-4px) scale(.97);
  transition:opacity .2s ease-in,transform .3s cubic-bezier(.4,0,.6,1),filter .2s ease-in,visibility 0s linear .3s}
.pg h3{grid-column:1/-1;margin:2px 4px 2px;font:700 11px ui-monospace,monospace;letter-spacing:.18em;text-transform:uppercase;color:var(--c);display:flex;align-items:center;gap:8px}
.pg.on h3{animation:fu .5s cubic-bezier(.22,1,.36,1) .14s backwards}
@keyframes fu{from{opacity:0;transform:translateY(8px)}}
.pg h3:before{content:"";width:22px;height:2px;background:var(--c);box-shadow:0 0 10px var(--c);border-radius:2px}

.t{position:relative;padding:12px 8px 11px;border-radius:16px;text-align:center;font-size:12.5px;cursor:pointer;color:#d8d1f5;
  background:linear-gradient(180deg,rgba(139,107,255,.11),rgba(139,107,255,.03));border:1px solid rgba(201,192,255,.12);
  transition:transform .22s cubic-bezier(.22,1,.36,1),box-shadow .22s ease-out,border-color .22s ease-out,background .22s ease-out,color .22s ease-out}
.pg.on .t{animation:cin .5s cubic-bezier(.22,1.25,.3,1) backwards;animation-delay:var(--dl,0s)}
@keyframes cin{from{opacity:0;transform:translateY(12px) scale(.93)}}
.t:hover{transform:translateY(-3px);border-color:var(--c);box-shadow:0 10px 24px color-mix(in srgb,var(--c) 30%,transparent)}
.t:active{transform:translateY(-1px) scale(.965);transition-duration:.08s}
.t.on{color:#fff;background:linear-gradient(180deg,color-mix(in srgb,var(--c) 45%,transparent),color-mix(in srgb,var(--c) 10%,transparent));border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 40%,transparent),inset 0 1px 0 rgba(255,255,255,.3)}
.tag{position:absolute;top:6px;right:6px;font:700 8px ui-monospace,monospace;letter-spacing:.1em;padding:2px 6px;border-radius:99px;color:#2fe3ba;background:rgba(47,227,186,.15);border:1px solid rgba(47,227,186,.45)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .dock{background:linear-gradient(180deg,rgba(48,34,92,.72),rgba(16,11,38,.8))}
  .pop{background:linear-gradient(160deg,rgba(52,36,104,.78),rgba(12,8,28,.84))}
}
/* gap is 5px, not 6: the fixed-width tier footer needs its 200px slot to stay
   clear of the six tiles inside the fixed 680px bar, and 1px here keeps the
   content centred without changing how the tiles read. */
.dock{position:relative;z-index:1;width:100%;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 10px;border-radius:26px;
  background:linear-gradient(180deg,rgba(139,107,255,.20),rgba(92,66,196,.07)),
             var(--bdImage,none) 0 var(--dockY,0px)/680px 340px no-repeat;
  background-color:rgba(24,14,52,.30);
  border:1px solid rgba(201,192,255,.15);
  box-shadow:0 12px 30px rgba(10,3,28,.5),inset 0 1px 0 rgba(214,205,255,.22),inset 0 -1px 0 rgba(30,14,70,.5)}
/* z-index 0 (not -1): a negative index would paint this highlight behind the
   bar's own translucent background, where the blurred backdrop washes it out
   entirely. At 0 it still sits under the buttons, because it comes first in
   the DOM and they come after. */
.hl{position:absolute;top:4px;bottom:4px;border-radius:16px;z-index:0;
  background:linear-gradient(180deg,rgba(139,107,255,.20),rgba(139,107,255,.05));border:1px solid rgba(201,192,255,.16);
  transition:left .5s cubic-bezier(.22,1.2,.3,1),width .5s cubic-bezier(.22,1.2,.3,1)}

/* LOGO / DASHBOARD BUTTON: only reacts when there is somewhere to go. On the dashboard it is inert. */
.logo{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;border:0;cursor:pointer;overflow:hidden;position:relative;
  background:#0f081a;   /* the official logo's dark field, behind the artwork */
  box-shadow:0 4px 10px rgba(6,2,16,.55);
  transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s ease-out}
.logo:not(.here):hover{transform:scale(1.06)}
.logo:not(.here):active{transform:scale(.94);transition-duration:.08s}
.logo.here{cursor:default}
.logo .bimg{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;image-rendering:auto}
.sep{flex:none;width:1px;height:34px;background:rgba(139,107,255,.24);margin:0 4px}
/* 6px, not 8px: tight tile padding keeps the six 56px tiles and the 200px
   footer inside the fixed 680px bar without touching the gap or the 44px
   orbs. */
.c{flex:none;position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:4px 6px 10px;border-radius:16px;cursor:pointer;
  border:0;background:none;color:#b3a7ec;font:600 10px 'Segoe UI',sans-serif;transition:color .35s ease-out}
/* Orb: the dock's own dark glass, not a coloured disc. With every logo now a
   single translucent accent, a violet disc would swallow its own glyph; the
   dark field keeps #8b6bff readable and lets the category's hover/active glow
   (still var(--c)) carry the colour instead. */
.orb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;position:relative;
  background:radial-gradient(circle at 32% 25%,rgba(255,255,255,.16),transparent 40%),
             linear-gradient(160deg,rgba(30,18,64,.92),rgba(14,9,32,.92));
  border:1px solid rgba(201,192,255,.16);
  box-shadow:0 6px 16px rgba(10,3,28,.4),inset 0 -6px 10px rgba(0,0,0,.35);
  transform:translateY(0) scale(1);
  transition:transform .45s cubic-bezier(.34,1.56,.64,1),box-shadow .45s ease-out,border-color .45s ease-out}
.c:hover .orb{transform:translateY(-5px) scale(1.08)}
.c:active .orb{transform:translateY(-1px) scale(.92);transition-duration:.09s}
.c.on{color:#fff}
.c.on .orb{transform:translateY(-4px) scale(1.1);box-shadow:0 0 22px color-mix(in srgb,var(--c) 55%,transparent),inset 0 -6px 10px rgba(0,0,0,.3)}
.c.on:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--c);box-shadow:0 0 8px var(--c);position:absolute;bottom:1px;left:50%;transform:translateX(-50%) scale(0);animation:dot .35s cubic-bezier(.34,1.56,.64,1) forwards .12s}
@keyframes dot{to{transform:translateX(-50%) scale(1)}}
/* Footer: current plan + version, matching the reference plan badge.

   The pill carries the star, the "YOUR PLAN" label over the plan name, and the
   app version chip on the right, all on one line. It tints and glows in the
   plan's own accent via --c, which the page sets from the live tier
   (Foundation teal, Performance blue, Maximum orange). The slot keeps a fixed
   width for every tier so the bar never reflows when the entitlement changes,
   and the badge is status text, not a control: no click handler, no hover
   state, no pointer cursor, no user-select. */
.ver{
  flex:none; width:212px; display:flex; align-items:center;
  justify-content:center; color:#5f5780;
}
.plan-mini{
  position:relative; overflow:hidden; width:100%; cursor:default; user-select:none;
  display:flex; align-items:center; gap:7px; padding:6px 9px; border-radius:15px;
  background:linear-gradient(135deg,color-mix(in srgb,var(--c,#2dd4bf) 28%,#0c1a1c),#0c0f1a);
  border:1px solid color-mix(in srgb,var(--c,#2dd4bf) 55%,transparent);
  box-shadow:0 0 18px color-mix(in srgb,var(--c,#2dd4bf) 26%,transparent);
}
.plan-mini::after{
  content:""; position:absolute; inset:0;
  background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);
  transform:translateX(-120%); animation:shine 4.5s ease-in-out infinite;
}
@keyframes shine{ to{ transform:translateX(120%); } }
@media (prefers-reduced-motion:reduce){ .plan-mini::after{ animation:none; } }
.plan-mini .pstar{
  width:30px; height:30px; flex:0 0 auto; border-radius:50%; display:grid; place-items:center;
  background:color-mix(in srgb,var(--c,#2dd4bf) 22%,#0b1415);
  border:1px solid color-mix(in srgb,var(--c,#2dd4bf) 60%,transparent);
}
.plan-mini .pstar svg{ width:16px; height:16px; fill:var(--c,#2dd4bf); filter:drop-shadow(0 0 5px var(--c,#2dd4bf)); }
.plan-mini .ptxt{ display:flex; flex-direction:column; flex:1 1 auto; min-width:0; line-height:1.08; text-align:left; }
.plan-mini .ptxt small{
  font:600 8px 'Segoe UI',system-ui,sans-serif; letter-spacing:.15em;
  text-transform:uppercase; color:#9a92b8; white-space:nowrap;
}
.plan-mini .ptxt b{
  font:700 13px 'Segoe UI',system-ui,sans-serif; color:var(--c,#2dd4bf);
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.plan-mini .pver{
  display:flex; align-items:center; line-height:1; flex:0 1 58px; min-width:0; max-width:72px;
  font:700 10px ui-monospace,monospace; color:#e7e3f5;
  background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.18);
  border-radius:7px; padding:3px 5px; overflow:hidden;
}
.plan-mini .pver span{ display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
/* SINGLE-COLOUR LOGOS. Every key is a white alpha mask (<i class="ic">) and
   the visible paint is currentColor: one see-through dock accent (#8b6bff at
   partial opacity) on orbs and tiles alike, full strength on hover/active.
   Exception: the CPU/GPU/RAM tiles carry their real category logo artwork
   (the green hardware PNGs in assets/icons) - paint() swaps those to an
   unmasked background-image so the actual logo file is shown as-is. */
.ic{display:block;background:currentColor;-webkit-mask-repeat:no-repeat;-webkit-mask-position:center;-webkit-mask-size:contain;
  mask-repeat:no-repeat;mask-position:center;mask-size:contain}
.t .ic{width:22px;height:22px;margin:0 auto 7px;color:#8b6bff;opacity:.75;
  filter:drop-shadow(0 0 8px color-mix(in srgb,var(--c) 55%,transparent));
  transition:color .2s ease-out,opacity .2s ease-out,filter .2s ease-out}
.t:hover .ic,.t.on .ic{opacity:1;filter:drop-shadow(0 0 10px var(--c))}
/* Orbs are the dock's own glass, not coloured discs, so the same translucent
   accent reads on them instead of disappearing into a matching gradient. */
.orb .ic{width:24px;height:24px;color:#8b6bff;opacity:.85;transition:opacity .2s ease-out}
.c:hover .orb .ic,.c.on .orb .ic{opacity:1}
.c:focus-visible,.t:focus-visible,.logo:focus-visible{outline:2px solid var(--c,#8b6bff);outline-offset:2px}
.c:focus-visible{outline-offset:3px}
</style></head><body>
<div class="dockwrap" id="wrap">
  <div class="pop" id="pop"></div>
  <div class="dock" id="dock"></div>
</div>
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script>
const D=[
 ["FPS","#8b6bff","fpsboost",[["cpu","CPU","","tweak:cpu"],["gpu","GPU","","tweak:gpu"],["ram","RAM","","tweak:ram"],["games","Games","","tweak:games"],["gauge","FPS boost","","tweak:fpsboost"]]],
 ["System","#8b6bff","system",[["system","Windows / system","","tweak:system"],["storage","Storage","","tweak:storage"],["audio","Audio","","tweak:audio"],["network","Network","","tweak:network"],["hourglass","Network QoS","","qos"]]],
 ["Input","#8b6bff","input",[["keyboard","Keyboard","","tweak:keyboard"],["mouse","Mouse","","tweak:mouse"],["input","Input","","tweak:input"],["delay_destroyer","Delay Destroyer","","tweak:delay_destroyer"]]],
 ["Tools","#8b6bff","tools",[["tools","Tools","","tools"],["controller","Controller overclock","","controller"],["app_optimizers","App Optimizers","","app_optimizers"],["debloat","Smart debloater","","debloat"],["route_analyzer","Route analyzer","SOON","route_analyzer"],["activity","Diagnostics","","diagnostics"]]],
 ["Profiles","#8b6bff","profiles",[["profiles","Game profiles","","profiles"],["fortnite","Fortnite settings","","tweak:fortnite"],["chat","AI assistant","","chat"]]],
 ["Settings","#8b6bff","settings",[["settings","Settings","","settings"]]]];

/* STATE. `page` = the page key currently shown by the app (updated from Python via sync()). */
let cat=0, item="", open=false, page="dashboard";
let ASSETS=null, ART=[], layers=[], closeT=null, BD="";
const SLIDE=44;   // px the category layers travel sideways when switching
const $=id=>document.getElementById(id);
/* The plan pill's star, matching the reference badge. Shared by every tier. */
const STAR_SVG='<svg viewBox="0 0 24 24"><path d="M12 2l3 6.5 7 .9-5.2 4.8 1.4 7L12 17.8 5.8 21.2l1.4-7L2 9.4l7-.9z"/></svg>';

function api(){return (window.pywebview&&window.pywebview.api)||null}
function tell(v){const a=api(); if(a&&a.panel)a.panel(!!v)}

function paint(){
 for(const el of document.querySelectorAll('[data-k]')){
  const key=el.dataset.k, tint=el.dataset.t||'';
  const u=(ASSETS&&(ASSETS[key]||(tint&&ASSETS[key+'|'+tint])))||'';
  if(!u)continue;
  if(el.tagName==='IMG'){el.src=u;continue}   // brand mark: shown as-is, not masked
  if(ART.indexOf(key)>=0){                    // CPU/GPU/RAM: real logo artwork, as-is
   el.style.webkitMaskImage=''; el.style.maskImage='';
   el.style.backgroundImage='url("'+u+'")';
   el.style.backgroundColor='transparent';
   el.style.backgroundSize='contain';
   el.style.backgroundRepeat='no-repeat';
   el.style.backgroundPosition='center';
   el.style.opacity='1';
   continue;
  }
  el.style.webkitMaskImage='url("'+u+'")'; el.style.maskImage='url("'+u+'")';
 }
}
function setAssets(map,art){ART=art||[];ASSETS=map||{};paint();document.body.classList.add('ready');moveHl(cat)}

/* Measure where the panel and the bar actually sit inside the 680x340 widget.
   Each one pulls its own slice out of the full-widget snapshot with a negative
   background-position, so the glass is confined to the two visible shapes
   instead of painting a full-size rectangle that would show through above the
   closed panel.

   offsetTop, not getBoundingClientRect(): the closed panel carries
   `transform:translateY(18px) scale(.965)`, and getBoundingClientRect() folds
   that transform in, so measuring it while closed put the panel at 33px and
   left the glass 25px out of line with the page whenever it opened. offsetTop
   is the untransformed layout position. */
function place(){
 const p=$('pop'),k=$('dock');
 if(!p||!k)return;
 const r=document.documentElement.style;
 r.setProperty('--popY',p.offsetTop+'px');
 r.setProperty('--dockY',k.offsetTop+'px');
}

/* Blurred snapshot of the page behind the dock, produced on the Qt side.
   Swapping the image is deferred to the next frame: setBackdrop fires about
   once a second and re-decoding a data URL inside the current task would show
   up as a hitch in the panel's own animation. */
function setBackdrop(url){
 if(typeof url!=='string'||!url||BD===url)return;
 BD=url;
 requestAnimationFrame(function(){
  const r=document.documentElement.style;
  r.setProperty('--bdImage','url("'+url+'")');
  r.setProperty('--bd','url("'+url+'")');
  place();
 });
}

/* An accent in the corner, not a wash over the whole panel. The earlier radii
   (760x560 on a 680x212 box) flooded the surface and turned the panel into a
   flat block of the category colour - which is what read as a solid teal/green
   box on System and Profiles. */
function glowCss(c){
 return 'radial-gradient(340px 220px at 12% 4%,color-mix(in srgb,#8b6bff 9%,transparent) 0,transparent 70%),'+
        'radial-gradient(300px 190px at 78% 10%,color-mix(in srgb,'+c+' 7%,transparent) 0,transparent 68%),'+
        'radial-gradient(320px 200px at 50% 104%,color-mix(in srgb,'+c+' 5%,transparent) 0,transparent 70%),transparent';
}
function moveHl(i){
 const d=$('dock'),b=d.querySelectorAll('.c'),hl=$('hl');
 if(!b[i]||!hl)return;
 const dr=d.getBoundingClientRect(),br=b[i].getBoundingClientRect();
 hl.style.left=(br.left-dr.left)+'px'; hl.style.width=br.width+'px';
}
function mark(i){
 const b=document.querySelectorAll('#dock .c');
 for(let x=0;x<b.length;x++)b[x].classList.toggle('on',x===i);
 moveHl(i);
 const g=$('glow'); if(g)g.style.background=glowCss(D[i][1]);
}
function markTiles(){
 for(const t of document.querySelectorAll('#pop .t'))t.classList.toggle('on',t.dataset.n===item);
}
function markHome(){const l=document.querySelector('#dock .logo'); if(l)l.classList.toggle('here',page==='dashboard')}

function build(){
 $('dock').innerHTML=
  `<button class="logo here" title="Maximum Tweaks – Dashboard" aria-label="Maximum Tweaks home"><img class="bimg" data-k="brand" alt=""></button><div class="sep"></div>`+
  `<div class="hl" id="hl"></div><div id="cats" style="display:contents">`+
  D.map((d,i)=>`<button class="c" style="--c:${d[1]}" data-i="${i}" title="${d[0]}" aria-label="${d[0]}"><div class="orb"><i class="ic" data-k="${d[2]}"></i></div>${d[0]}</button>`).join('')+
  `</div><div class="sep"></div><div class="ver">`+
  `<span class="plan-mini" id="planBadge" style="--c:#2dd4bf"><span class="pstar">${STAR_SVG}</span><span class="ptxt"><small>YOUR PLAN</small><b>…</b></span><span class="pver" id="verNum">v--</span></span>`+
  `</div>`;
 $('pop').innerHTML='<div class="glow" id="glow"></div>'+D.map(([cn,cc,,items],i)=>
  `<div class="pg" data-cat="${i}" style="--c:${cc}"><h3>${cn}</h3>`+
  items.map(([k,n,x,r],j)=>`<div class="t" style="--dl:${(0.24+j*0.05).toFixed(2)}s" data-n="${n}" data-r="${r}" tabindex="0" role="button" title="${n}">${x?`<b class="tag">${x}</b>`:''}<i class="ic" data-k="${k}" data-t="${cc}"></i>${n}</div>`).join('')+
  `</div>`).join('');
 layers=[...$('pop').querySelectorAll('.pg')];
}

/* dir: +1 = moving to a category on the right, -1 = left, 0 = first open (just rises) */
function showLayer(i,dir){
 layers.forEach((l,k)=>{
  clearTimeout(l._t);
  if(k===i){
   if(!l.classList.contains('on')){
    if(!l.classList.contains('exit')){          // fully reset layer: park it on the entry side before it animates in
     l.style.setProperty('--ix',(dir*SLIDE)+'px');
     void l.offsetWidth;
    }
    l.classList.remove('exit');l.classList.add('on');
   }
  }else if(l.classList.contains('on')){
   l.style.setProperty('--ox',(-dir*SLIDE)+'px');
   l.classList.remove('on');l.classList.add('exit');
   l._t=setTimeout(()=>l.classList.remove('exit'),520);
  }
 });
}

/* the ONLY place the panel opens or closes */
function setOpen(v){
 v=!!v;
 if(v===open)return;
 open=v;
 clearTimeout(closeT);
 if(v){
  tell(true);
  showLayer(cat,0);
  $('pop').classList.add('show');
 }else{
  $('pop').classList.remove('show');
  closeT=setTimeout(()=>{
   if(open)return;
   layers.forEach(l=>{clearTimeout(l._t);l.classList.remove('on','exit')});
   tell(false);
  },260);
 }
}

/* USER ACTIONS */
function pick(i){
 if(!open){cat=i;mark(i);setOpen(true);return}
 if(i===cat){setOpen(false);return}
 const dir=i>cat?1:-1;
 cat=i;mark(i);showLayer(i,dir);
}
function sel(n,k){
 item=n;markTiles();setOpen(false);
 if(k!==page)go(k);              // already on that page: just close the panel, change nothing
}
function home(){
 if(page==='dashboard')return;   // already on the dashboard: literally do nothing
 go('dashboard');
}
function go(k){
 const a=api();
 if(a&&a.navigate){a.navigate(k);return}
 if(!go._n)go._n=0;
 if(go._n++<80)setTimeout(()=>go(k),25);
}
function closePanel(){if(!open)return false;setOpen(false);return true}
function isOpen(){return open}

/* Called from Python after every navigation */
function sync(k){
 page=k||"dashboard";
 markHome();
 if(page==='dashboard'){item="";markTiles();setOpen(false);return true}
 for(let i=0;i<D.length;i++){
  const items=D[i][3];
  for(let j=0;j<items.length;j++){
   if(items[j][3]===k){cat=i;item=items[j][1];mark(cat);markTiles();setOpen(false);return true}
  }
 }
 return false;
}

/* ------------------------------------------------------------------
   Current plan badge (was a hard-coded gold "PRO").

   `tier` arrives from Python and is the canonical value read from
   engine.entitlements.current_tier() - the same source the tweak cards and the
   locked-card badges use - so the dock cannot drift from what the user actually
   holds. Pushed again on every license change, so activating, expiring or
   revoking a key updates it without a restart.
   ------------------------------------------------------------------ */
/* Plan name colours. Kept here (not in CSS) so the badge is tinted from the
   canonical tier value the app already holds; the same three accents are used
   on the pricing page and the tweak banner. */
const MX_PLAN_COLOR={ foundation:'#2dd4bf', performance:'#38bdf8', maximum:'#f5a524' };
function setTier(tier,label,version){
 const b=$('planBadge');
 if(!b) return;
 const t=(tier==='performance'||tier==='maximum')?tier:'foundation';
 const name=String(label||t).trim()||t;
 /* Plan name in the UI font, sentence case (read, not scanned) and tinted with
    the tier's own accent, so activating, expiring or revoking a key re-tints
    the badge without a restart. The badge is status only - it is not a control,
    so it has no click handler, no hover state and no pointer cursor, and the
    upgrade path stays in the Updater screen where the user opted into it. */
 b.className='plan-mini '+t;
 b.style.setProperty('--c',MX_PLAN_COLOR[t]);
 const vers=version?('v'+String(version).replace(/^v/,'')):'v--';
 b.innerHTML='<span class="pstar">'+STAR_SVG+'</span>'+
             '<span class="ptxt"><small>YOUR PLAN</small><b>'+name+'</b></span>'+
             '<span class="pver" id="verNum"><span>' + vers + '</span></span>';
 b.title='You are on the '+name+' plan';
}

/* EVENTS (delegated) */
$('dock').addEventListener('click',e=>{
 const c=e.target.closest('.c'); if(c){pick(+c.dataset.i);return}
 if(e.target.closest('.logo'))home();
});
$('pop').addEventListener('click',e=>{const t=e.target.closest('.t'); if(t)sel(t.dataset.n,t.dataset.r)});
$('pop').addEventListener('keydown',e=>{
 const t=e.target.closest&&e.target.closest('.t');
 if(t&&(e.key==='Enter'||e.key===' ')){e.preventDefault();sel(t.dataset.n,t.dataset.r)}
});
document.addEventListener('click',e=>{
 if(open&&!(e.target.closest&&e.target.closest('#dock,#pop')))setOpen(false);
},true);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closePanel()});
addEventListener('resize',()=>moveHl(cat));

/* BOOT */
(function(){
 window.pywebview=window.pywebview||{};
 if(window.qt&&window.qt.webChannelTransport&&window.QWebChannel){
  new QWebChannel(window.qt.webChannelTransport,function(ch){
   window.pywebview.api=ch.objects.api;
   tell(open);
  });
 }
})();
build(); paint(); mark(cat); markHome();
setTimeout(()=>{document.body.classList.add('ready');moveHl(cat)},1200);
