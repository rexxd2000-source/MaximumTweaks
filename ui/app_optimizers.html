<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App Optimizers — Maximum Tweaks</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0a0a12;
    --panel: #121320;
    --panel2: #151623;
    --border: #22233a;
    --violet: #7c5cff;
    --violet-soft: rgba(124,92,255,0.14);
    --text: #f2f3f7;
    --sub: #8a8d99;
    --green: #3ddc97;
    --blue: #4fb6ed;
    --orange: #f5c874;
    --red: #ff6f6f;
  }
  body {
    background: #0a0a12;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    padding: 26px 34px 40px;
  }
  .topbar { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 24px; }
  .page-title { font-size: 23px; font-weight: 800; display: flex; align-items: center; gap: 10px; }
  .page-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--violet-soft); border: 1px solid rgba(124,92,255,0.4); display: flex; align-items: center; justify-content: center; box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 16px rgba(124,92,255,0.18); }
  .page-icon svg { width: 17px; height: 17px; }
  .page-sub { font-size: 12.5px; color: var(--sub); margin-top: 4px; margin-left: 44px; }
  .topbar-actions { display: flex; gap: 10px; }
  .search { display: flex; align-items: center; gap: 8px; background: var(--panel); border: 1px solid var(--border); border-radius: 9px; padding: 8px 12px; width: 210px; }
  .search svg { width: 14px; height: 14px; color: #565866; }
  .search input { background: none; border: none; outline: none; color: var(--text); font-size: 12px; width: 100%; }
  .search input::placeholder { color: #565866; }
  .btn { display: flex; align-items: center; gap: 7px; border: none; color: #fff; font-size: 12px; font-weight: 700; padding: 9px 15px; border-radius: 9px; cursor: pointer; }
  .btn-primary { background: linear-gradient(150deg, #9d84ff, #6b46ff); box-shadow: 0 4px 16px rgba(124,92,255,0.35); }
  .btn-ghost { background: rgba(255,255,255,0.03); border: 1px solid var(--border); }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 24px; }
  .stat-card { position: relative; background: linear-gradient(165deg, var(--panel2), var(--panel)); border: 1px solid var(--border); border-radius: 13px; padding: 15px 16px; overflow: hidden; }
  .stat-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(90% 70% at 0% 0%, var(--tint), transparent 60%); pointer-events: none; }
  .stat-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; position: relative; }
  .stat-icon { width: 28px; height: 28px; border-radius: 8px; display: flex; align-items: center; justify-content: center; background: var(--iconbg); border: 1px solid var(--iconborder); }
  .stat-icon svg { width: 14px; height: 14px; }
  .stat-value { position: relative; font-size: 21px; font-weight: 800; }
  .stat-label { position: relative; font-size: 11px; color: var(--sub); margin-top: 2px; }
  .stat-delta { font-size: 10.5px; font-weight: 700; color: var(--green); }
  .section-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .section-head h2 { font-size: 14px; font-weight: 700; color: #d7d8e2; }
  .filter-row { display: flex; gap: 6px; }
  .chip { font-size: 10.5px; font-weight: 600; color: var(--sub); background: var(--panel); border: 1px solid var(--border); padding: 5px 10px; border-radius: 100px; cursor: pointer; }
  .chip.active { color: #ded7ff; background: var(--violet-soft); border-color: rgba(124,92,255,0.4); }
  .app-list { display: flex; flex-direction: column; gap: 12px; }
  .app-card { position: relative; background: linear-gradient(165deg, var(--panel2) 0%, var(--panel) 100%); border: 1px solid var(--border); border-radius: 14px; padding: 16px 18px; overflow: hidden; }
  .app-card::before { content: ""; position: absolute; inset: 0; background: radial-gradient(70% 90% at 0% 0%, var(--tint), transparent 60%); pointer-events: none; }
  /* Working card: dimmed, with a slow sheen so it reads as "in progress"
     while the engine is applying or restarting that one app. */
  .app-card.working { opacity: .72; }
  .app-card.working::after {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(100deg, transparent 20%, rgba(255,255,255,0.055) 45%, transparent 70%);
    background-size: 220% 100%;
    animation: cardSheen 1.5s linear infinite;
  }
  @keyframes cardSheen { 0% { background-position: 130% 0; } 100% { background-position: -30% 0; } }
  .status-tag.busy { color: #b9aeff; background: rgba(124,92,255,0.16); border: 1px solid rgba(124,92,255,0.40); }
  .app-card-top { position: relative; display: flex; align-items: center; gap: 14px; }
  .app-icon { width: 46px; height: 46px; border-radius: 11px; display: flex; align-items: center; justify-content: center; background: var(--iconbg); border: 1px solid var(--iconborder); box-shadow: inset 0 1px 0 rgba(255,255,255,0.10); flex-shrink: 0; }
  .app-icon svg { width: 26px; height: 26px; display: block; }
  .app-title-row { display: flex; align-items: center; gap: 8px; }
  .app-name { font-size: 15px; font-weight: 700; }
  .status-tag { font-size: 9.5px; font-weight: 700; letter-spacing: 0.03em; padding: 2px 7px; border-radius: 100px; }
  .status-tag.active { color: #8ff0c4; background: rgba(61,220,151,0.14); border: 1px solid rgba(61,220,151,0.35); }
  .status-tag.detected { color: #a9acba; background: rgba(255,255,255,0.05); border: 1px solid var(--border); }
  .app-desc { font-size: 12px; color: var(--sub); margin-top: 3px; max-width: 560px; line-height: 1.45; }
  .app-meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
  .meta-pill {
    font-size: 10.5px; font-weight: 600; letter-spacing: .2px;
    color: var(--sub); background: rgba(255,255,255,.04);
    border: 1px solid rgba(255,255,255,.07);
    padding: 2px 8px; border-radius: 999px; white-space: nowrap;
  }
  .meta-pill.green { color: #8ff0c4; background: rgba(61,220,151,.10); border-color: rgba(61,220,151,.28); }
  .app-right { margin-left: auto; display: flex; align-items: center; gap: 22px; flex-shrink: 0; }
  .savings { text-align: right; }
  .savings .val { font-size: 15px; font-weight: 800; color: #8ff0c4; }
  .savings .lbl { font-size: 9.5px; color: var(--sub); margin-top: 1px; }
  .toggle { width: 40px; height: 23px; border-radius: 100px; background: linear-gradient(160deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02)); border: 1px solid var(--border); display: flex; align-items: center; padding: 2px; cursor: pointer; }
  .toggle.on { background: linear-gradient(160deg, rgba(61,220,151,0.30), rgba(61,220,151,0.14)); border-color: rgba(61,220,151,0.45); }
  .toggle .knob { width: 17px; height: 17px; border-radius: 50%; background: #565866; }
  .toggle.on .knob { background: var(--green); margin-left: auto; box-shadow: 0 0 8px rgba(61,220,151,0.7); }
  .chevron { width: 15px; height: 15px; color: #565866; cursor: pointer; transform: rotate(-90deg); }
  .chevron.open { transform: rotate(0deg); }
  .details { display: none; margin-top: 14px; padding-top: 14px; border-top: 1px solid var(--border); }
  .details.open { display: block; }
  .feature-strip { display: flex; flex-wrap: wrap; gap: 8px; }
  .feature { display: flex; align-items: center; gap: 6px; font-size: 11px; color: #b6b8c4; background: rgba(255,255,255,0.03); border: 1px solid var(--border); padding: 5px 10px; border-radius: 100px; }
  .feature svg { width: 11px; height: 11px; color: var(--green); }
  .impact-strip { display: flex; align-items: center; gap: 6px; margin-top: 14px; }
  .impact-strip .imp-label { font-size: 10.5px; color: var(--sub); }
  .imp-bars { display: flex; gap: 3px; }
  .imp-bars span { width: 5px; height: 12px; border-radius: 2px; background: #4a4b57; }
  .imp-bars span.fill { background: #f5c874; }
  .ops { margin-top: 14px; display: flex; flex-direction: column; gap: 8px; }
  .op { display: flex; align-items: flex-start; gap: 10px; padding: 8px 10px; border-radius: 9px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); }
  .op input { margin-top: 2px; }
  .op-title { font-size: 12px; font-weight: 600; }
  .op-desc { font-size: 11px; color: var(--sub); margin-top: 2px; line-height: 1.45; }
  .actions { display: flex; gap: 8px; margin-left: auto; }
  .btn-sm { padding: 5px 10px; font-size: 11px; }
  .progress { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #121320; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: none; }
  .progress.show { display: flex; align-items: center; gap: 12px; }
  .progress-bar { width: 180px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08); }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #9d84ff, #3ddc97); transition: width 0.2s ease; }
  .toast { position: fixed; top: 24px; left: 50%; transform: translateX(-50%); background: #121320; border: 1px solid var(--border); border-radius: 10px; padding: 10px 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.4); display: none; }
  .toast.show { display: block; }
  .empty { color: var(--sub); padding: 20px 0; }
</style>

    <div>
      <div class="page-title">

    function icon(k){ return ICONS[k]||''; }
    /* Honest RAM reporting.
       - Not engaged: show the app's CURRENT measured working set, no claim.
       - Engaged:     show the REAL measured reclaim (working set captured
                      before optimizing vs. now). If nothing has changed yet
                      (apps only give memory back after a restart) say so
                      instead of inventing a number. */
    function ramText(a){
      if(!a.installed) return '—';
      if(!a.engaged) return Math.round(a.ram_mb||0)+' MB';
      const saved = a.ram_reclaimed_mb||0;
      if(saved >= 1) return saved.toFixed(0)+' MB';
      return '0 MB';
    }
    function ramHint(a){
      if(!a.installed) return '';
      if(!a.engaged) return 'Current process memory (measured live)';
      if((a.ram_reclaimed_mb||0) >= 1)
        return 'Measured: ' + Math.round(a.ram_before_mb||0) + ' MB before → ' + Math.round(a.ram_mb||0) + ' MB now';
      if(a.ram_before_mb)
        return 'No change yet — ' + Math.round(a.ram_before_mb||0) + ' MB before and now. Restart ' + a.name + ' to realise savings.';
      return 'Restart ' + a.name + ' to measure real savings';
    }
    function showToast(t){ $('toast').textContent=t; $('toast').classList.add('show'); setTimeout(()=>$('toast').classList.remove('show'),1600); }
    function setBusy(b){
      document.querySelectorAll('.toggle,.chip,.btn').forEach(function(e){
        e.style.pointerEvents = b ? 'none' : '';
        e.style.opacity = b ? '0.5' : '';
      });
    }
    /* Per-card busy state.
       Toggling one app must never lock or disturb the other cards, so this
       scopes to a single .app-card and only its own controls. */
    function setCardBusy(k, on){
      const cards = document.querySelectorAll('.app-card');
      for(const c of cards){
        if(c.dataset.key !== k) continue;
        c.classList.toggle('working', !!on);
        c.querySelectorAll('.toggle,.btn').forEach(function(e){
          e.style.pointerEvents = on ? 'none' : '';
          e.style.opacity = on ? '0.55' : '';
        });
      }
    }
    function setCardState(k, label, tone){
      const cards = document.querySelectorAll('.app-card');
      for(const c of cards){
        if(c.dataset.key !== k) continue;
        const tag = c.querySelector('.status-tag');
        if(!tag) continue;
        if(label){
          tag.textContent = label;
          tag.className = 'status-tag ' + (tone || 'detected');
        }
      }
    }
    /* Official Lucide (lucide-static, ISC) 24x24 line glyphs, stroke 2.
       Sourced from lucide.dev / jsdelivr lucide-static, not hand-rolled. */
    const LUCIDE = {
      appWindow: '<path d="M10 4v4"/><path d="M6 4v4"/><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M2 8h20"/>',
      shieldCheck: '<path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/>',
      memoryStick: '<path d="M12 12v-2"/><path d="M12 18v-2"/><path d="M16 12v-2"/><path d="M16 18v-2"/><path d="M2 11h1.5"/><path d="M20 18v-2"/><path d="M20.5 11H22"/><path d="M4 18v-2"/><path d="M8 12v-2"/><path d="M8 18v-2"/><rect x="2" y="6" width="20" height="10" rx="2"/>',
      hardDrive: '<path d="M10 16h.01"/><path d="M2.212 11.577a2 2 0 0 0-.212.896V18a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-5.527a2 2 0 0 0-.212-.896L18.55 5.11A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/><path d="M21.946 12.013H2.054"/><path d="M6 16h.01"/>',
    };
    function lucide(body, color, w){
      return '<svg viewBox="0 0 24 24" fill="none" stroke="' + color + '" stroke-width="' + (w||2) + '" stroke-linecap="round" stroke-linejoin="round">' + body + '</svg>';
    }
    function renderStats(){
      const d=window.mx.data||data;
      const ram = d.ramReclaimed||0;
      const disk = d.diskSaved||0;
      const cards = [
        [ lucide(LUCIDE.appWindow, '#b9aeff'), d.totalDetected, 'Apps detected', '#7c5cff' ],
        [ lucide(LUCIDE.shieldCheck, '#3ddc97'), d.totalEngaged, 'Optimizations active', '#3ddc97' ],
        [ lucide(LUCIDE.memoryStick, '#f5c874'), ram.toFixed(0)+' MB', 'RAM reclaimed (measured)', '#f5c874' ],
        [ lucide(LUCIDE.hardDrive, '#4fb6ed'), disk.toFixed(0)+' MB', 'Disk freed (measured)', '#4fb6ed' ],
      ];
      $('stats').innerHTML = cards.map(function(c){
        return `
        <div class="stat-card" style="--tint: ${c[3]}20;">
          <div class="stat-top">
            <div class="stat-icon" style="background:${c[3]}16;border-color:${c[3]}40">${c[0]}</div>
          </div>
          <div class="stat-value">${c[1]}</div>
          <div class="stat-label">${c[2]}</div>
        </div>`;
      }).join('');
    }
    function passFilter(a){
      if(q && !a.name.toLowerCase().includes(q)) return false;
      if(filter==='active') return a.engaged;
      if(filter==='available') return a.installed && !a.engaged;
      return true;
    }
    function renderApps(){
      const d=window.mx.data||data;
      const list = Object.values(d.apps||{}).filter(passFilter);
      $('apps').innerHTML = list.length? list.map(a=>`
        <div class="app-card" data-key="${a.key}" style="--tint: ${a.color}10;">
          <div class="app-card-top">
            <div class="app-icon" style="--iconbg:${a.color}16;--iconborder:${a.color}40;">${icon(a.icon)}</div>
            <div>
              <div class="app-title-row">
                <div class="app-name">${a.name}</div>
                ${a.installed?(a.engaged?'<div class="status-tag active">ACTIVE</div>':'<div class="status-tag detected">AVAILABLE</div>'):'<div class="status-tag">NOT INSTALLED</div>'}
              </div>
              <div class="app-desc">${a.desc}</div>
              <div class="app-meta">
                ${a.installed?`<span class="meta-pill" title="Detected version">${a.version||'version unknown'}</span>`:''}
                ${a.engaged&&a.disk_saved_mb?`<span class="meta-pill green" title="Real bytes removed from the install folder">${a.disk_saved_mb} MB freed on disk</span>`:''}
                ${a.engaged?`<span class="meta-pill" title="Operations applied">${(a.ops_text||[]).length} change(s) applied</span>`:''}
              </div>
            </div>
            <div class="app-right">
              <div class="savings" title="${ramHint(a)}">
                <div class="val" style="${a.engaged?'':'color:#6b7394'}">${ramText(a)}</div>
                <div class="lbl">${a.engaged?'RAM saved':'RAM now'}</div>
              </div>
              <div class="toggle ${a.engaged?'on':''}" onclick="toggle('${a.key}', ${!a.engaged})"><div class="knob"></div></div>
              <svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" onclick="expand('${a.key}')"><path d="M6 9l6 6 6-6"/></svg>
            </div>
          </div>
          <div class="details" id="det-${a.key}">
            <div class="feature-strip">
              ${(a.features||[]).map(f=>`<div class="feature"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M20 6L9 17l-5-5"/></svg>${f}</div>`).join('')}
            </div>
            <div class="impact-strip">
              <div class="imp-label">Impact</div>
              <div class="imp-bars">${[1,2,3,4].map(i=>`<span class="${i<=a.impact?'fill':''}"></span>`).join('')}</div>
            </div>
            <div class="ops">
              ${(a.ops||[]).map(o=>`
                <div class="op">
                  <input type="checkbox" id="opt-${a.key}-${o.id}" ${o.optional?(o.applied?'checked':''):'checked disabled'}>
                  <div style="flex:1">
                    <div class="op-title">${o.title}</div>
                    <div class="op-desc">${o.desc}</div>
                  </div>
                </div>`).join('')}
              <div style="display:flex;justify-content:flex-end;margin-top:8px;gap:8px">
                ${a.engaged?`<button class="btn btn-ghost btn-sm" onclick="reset('${a.key}')">Reset</button>`:''}
                <button class="btn btn-primary btn-sm" onclick="apply('${a.key}')">Apply</button>
              </div>
            </div>
          </div>
        </div>`).join('') : '<div class="empty">No apps match your filters.</div>';
    }
    function expand(k){ const el=$('det-'+k); if(!el) return; el.classList.toggle('open'); }
    function toggle(k,on){ if(on) apply(k); else reset(k); }
    function apply(k){
      const a=window.mx.data.apps[k]; if(!a) return;
      const opts=[];
      (a.ops||[]).forEach(o=>{ if(o.optional){ const cb=$('opt-'+k+'-'+o.id); if(cb&&cb.checked) opts.push(o.id); }});
      setCardBusy(k, true);
      setCardState(k, 'APPLYING', 'detected');
      if(api()) api().activate(k, opts);
    }
    function reset(k){
      setCardBusy(k, true);
      setCardState(k, 'RESETTING', 'detected');
      if(api()) api().reset(k);
    }
    window.mx = {
      data: data,
      setData: function(d){
        window.mx.data = d||{};
        renderStats(); renderApps();
      },
      setProgress: function(i, n, label){
        const el=$('progress'), f=$('progFill'), t=$('progText');
        el.classList.add('show');
        f.style.width = (n ? Math.round((i/n)*100) : 0) + '%';
        t.textContent = (label||'') + ' (' + (i||0) + '/' + (n||0) + ')';
      },
      hideProgress: function(){ $('progress').classList.remove('show'); },
      showToast,
      setBusy,
      setCardBusy,
      setCardState,
    };
    document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{ document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active')); c.classList.add('active'); filter=c.dataset.filter; renderApps(); });
    $('search').oninput=e=>{ q=e.target.value.toLowerCase(); renderApps(); };
    $('btnRefresh').onclick=()=>{ if(api()) api().detect(); };
    $('btnOptimizeAll').onclick=()=>{ if(api()) api().optimizeAll(); };
    if(window.qt && window.qt.webChannelTransport && window.QWebChannel){
      new QWebChannel(window.qt.webChannelTransport,function(ch){
        window.pywebview = window.pywebview||{};
        window.pywebview.api = ch.objects.api;
        setTimeout(()=>{ if(api()) api().detect(); }, 10);
      });
    } else {
      setTimeout(()=>{ if(api()) api().detect(); }, 10);
    }
  </script>
</body>
</html>
