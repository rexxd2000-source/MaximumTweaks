name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: windows-latest
    # The built-in GITHUB_TOKEN needs permission to create the release and
    # upload assets; workflows default to read-only on many repos.
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Must match the pinned versions in requirements.txt and the README
          # "Build the .exe" section - CI is the single source of truth for
          # the published artifact.
          python-version: '3.14'

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r auth_backend/requirements-dev.txt

      - name: Extract version from tag
        id: get_version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v','V')
          echo "version=$version" >> $env:GITHUB_OUTPUT
          echo "VERSION=$version" >> $env:GITHUB_ENV

      # A release must ship exactly what the app reports: tag v2.5.3 requires
      # APP_VERSION = "2.5.3" (rc tags likewise, e.g. v2.5.3-rc1).
      - name: Verify tag matches APP_VERSION
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $cfg = Get-Content "config\app_config.py" -Raw
          if ($cfg -notmatch 'APP_VERSION\s*=\s*"([^"]+)"') {
            Write-Error "APP_VERSION not found in config\app_config.py"
            exit 1
          }
          $appv = $Matches[1]
          if ($appv -ne $version) {
            Write-Error "tag v$version does not match APP_VERSION '$appv' - bump config/app_config.py or fix the tag"
            exit 1
          }
          Write-Host "tag v$version == APP_VERSION $appv"

      - name: Run test suites
        shell: pwsh
        run: |
          $env:PYTHONDONTWRITEBYTECODE = "1"
          python -m pytest tests -q -p no:cacheprovider
          if ($LASTEXITCODE -ne 0) { Write-Error "app test suite failed"; exit 1 }
          Push-Location auth_backend
          python -m pytest tests -q -p no:cacheprovider
          $code = $LASTEXITCODE
          Pop-Location
          if ($code -ne 0) { Write-Error "auth test suite failed"; exit 1 }

      - name: Catalogue validation and release gate
        shell: pwsh
        run: |
          python tools/check_validation_drift.py
          if ($LASTEXITCODE -ne 0) { Write-Error "validation drift check failed"; exit 1 }
          python tools/audit_tweak_db.py
          if ($LASTEXITCODE -ne 0) { Write-Error "catalogue release gate failed"; exit 1 }

      - name: Build app with PyInstaller
        shell: pwsh
        run: |
          python -m PyInstaller MaximumTweaks.spec --noconfirm

      - name: Smoke test frozen exe
        shell: pwsh
        run: |
          $exe = "dist\MaximumTweaks.exe"
          & $exe --cli stats
          if ($LASTEXITCODE -ne 0) { Write-Error "cli stats failed"; exit 1 }
          & $exe --cli show perf-005
          if ($LASTEXITCODE -ne 0) { Write-Error "cli show failed"; exit 1 }
          & $exe --cli search superfetch
          if ($LASTEXITCODE -ne 0) { Write-Error "cli search failed"; exit 1 }
          & $exe --cli show power-006
          if ($LASTEXITCODE -ne 1) { Write-Error "removed tweak must exit 1, got $LASTEXITCODE"; exit 1 }
          $out = (& $exe --cli apply perf-005 --dry-run 2>&1 | Out-String)
          if ($LASTEXITCODE -ne 0) { Write-Error "cli dry-run exited $LASTEXITCODE"; exit 1 }
          if ($out -notmatch "Dry-run:") { Write-Error "cli dry-run did not preview: $out"; exit 1 }
          Write-Host "smoke OK"

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $nsi = "MaximumTweaks-Setup.nsi"
          if (!(Test-Path $nsi)) {
            Write-Error "NSIS script $nsi not found"
            exit 1
          }
          # choco does not refresh PATH for the current session, and the
          # installer location varies (Program Files vs Program Files (x86)).
          $candidates = @(
            "$env:ProgramFiles\NSIS\makensis.exe",
            "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          )
          $makensis = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $makensis) {
            $env:Path = [System.Environment]::GetEnvironmentVariable("Path","Machine") + ";" +
              [System.Environment]::GetEnvironmentVariable("Path","User")
            $cmd = Get-Command makensis.exe -ErrorAction SilentlyContinue
            if ($cmd) { $makensis = $cmd.Source }
          }
          if (-not $makensis) {
            Write-Error "makensis.exe not found (checked Program Files and PATH)"
            exit 1
          }
          Write-Host "using $makensis"
          & $makensis /DVERSION=$version $nsi
          if ($LASTEXITCODE -ne 0) {
            Write-Error "makensis failed with exit code $LASTEXITCODE"
            exit 1
          }
          $setup = "MaximumTweaks-Setup-$version.exe"
          if (!(Test-Path $setup)) {
            Write-Error "makensis reported success but $setup is missing"
            exit 1
          }

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          $installer = "MaximumTweaks-Setup-$version.exe"
          $hash = (Get-FileHash -Path $installer -Algorithm SHA256).Hash.ToLower()
          "$hash  $installer" | Out-File -FilePath "$installer.sha256" -Encoding ascii
          # The in-app updater downloads the portable exe (UPDATE_EXE_NAME),
          # so it needs its own published checksum alongside the installer.
          $exe = "dist\MaximumTweaks.exe"
          $hash2 = (Get-FileHash -Path $exe -Algorithm SHA256).Hash.ToLower()
          "$hash2  MaximumTweaks.exe" | Out-File -FilePath "dist\MaximumTweaks.exe.sha256" -Encoding ascii
          # Combined checksum file for the release (sha256sum -c SHA256SUMS.txt).
          @("$hash2  MaximumTweaks.exe",
            "$hash  $installer") | Out-File -FilePath "SHA256SUMS.txt" -Encoding ascii

      - name: Report artifact hashes and sizes
        shell: pwsh
        run: |
          $version = "$env:VERSION"
          foreach ($f in @("dist\MaximumTweaks.exe",
                           "MaximumTweaks-Setup-$version.exe",
                           "SHA256SUMS.txt")) {
            if (!(Test-Path $f)) { Write-Error "missing artifact: $f"; exit 1 }
            $item = Get-Item $f
            $hash = (Get-FileHash -Path $f -Algorithm SHA256).Hash.ToLower()
            $line = "{0}  {1} bytes  sha256={2}" -f $f, $item.Length, $hash
            Write-Host $line
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "``$line``"
          }

      # A release without installer fields in the served manifest would strand
      # every NSIS-installed copy (the updater prefers installer_url when the
      # app sits in the registered install folder). release.ps1's
      # Update-Manifest writes these fields; this gate makes skipping it
      # impossible. Checks presence only - rc tags intentionally keep the
      # stable manifest version, and the assets this points at are created by
      # this very run.
      - name: Validate update manifest installer fields
        shell: pwsh
        run: |
          $path = "auth_backend\web\update.json"
          if (!(Test-Path $path)) {
            Write-Host "::error::$path not found"
            exit 1
          }
          $m = Get-Content $path -Raw | ConvertFrom-Json
          $errors = @()
          if (-not $m.version)       { $errors += "version missing" }
          if (-not $m.url)           { $errors += "url missing" }
          if (-not $m.installer_url) { $errors += "installer_url missing" }
          if (-not ($m.installer_sha256 -or $m.installer_checksum_url)) {
            $errors += "installer_sha256 or installer_checksum_url missing"
          }
          if ($errors.Count -gt 0) {
            foreach ($e in $errors) { Write-Host "::error::$path - $e" }
            exit 1
          }
          Write-Host "manifest OK: version=$($m.version); installer_url=$($m.installer_url)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "manifest OK: version=$($m.version)"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Maximum Tweaks v${{ steps.get_version.outputs.version }}
          body_path: CHANGELOG.md
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/MaximumTweaks.exe
            dist/MaximumTweaks.exe.sha256
            MaximumTweaks-Setup-${{ steps.get_version.outputs.version }}.exe
            MaximumTweaks-Setup-${{ steps.get_version.outputs.version }}.exe.sha256
            SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
